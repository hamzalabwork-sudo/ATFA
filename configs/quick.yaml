# Smoke-test protocol: same pipeline, fewer seeds/levels/scenarios and shorter training.
# Results from this config are for checking the pipeline, not for the paper.
base: default.yaml

detectors:
  deep: {epochs: 10, patience: 3}
  lstm_ae: {epochs: 12}

experiment:
  seeds: [0, 1]
  workers: 4
  sensitivity_seeds: [0]
  scenarios:
    id:                 {split: chronological, levels: [0.10, 0.30]}
    ood_family_forged:  {split: chronological, levels: [0.20], holdout_family: forged_identity}
    ood_intensity_low:  {split: chronological, levels: [0.20], alpha_multiplier: 0.4}
    ood_asset:          {split: asset, levels: [0.20]}
